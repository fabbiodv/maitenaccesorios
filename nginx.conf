
# HTTP to HTTPS redirect for main domain
server {
    listen 80;
    server_name maitenaccesorios.com www.maitenaccesorios.com;
    return 301 https://$server_name$request_uri;
}

# HTTP to HTTPS redirect for admin subdomain
server {
    listen 80;
    server_name admin.maitenaccesorios.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS server for main domain (only frontend store)
server {
    listen 443 ssl http2;
    server_name maitenaccesorios.com www.maitenaccesorios.com;

    ssl_certificate /etc/letsencrypt/live/maitenaccesorios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maitenaccesorios.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Frontend Next.js (storefront)
    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # File upload size
    client_max_body_size 10M;
}

# HTTPS server for admin subdomain (admin dashboard + APIs)
server {
    listen 443 ssl http2;
    server_name admin.maitenaccesorios.com;

    ssl_certificate /etc/letsencrypt/live/maitenaccesorios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maitenaccesorios.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Admin dashboard (root path on admin subdomain)
    location / {
        proxy_pass http://localhost:9000/app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Admin API routes
    location /admin {
        proxy_pass http://localhost:9000/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Store API routes
    location /store {
        proxy_pass http://localhost:9000/store;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth API routes
    location /auth {
        proxy_pass http://localhost:9000/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File upload size
    client_max_body_size 10M;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name maitenaccesorios.com www.maitenaccesorios.com;
    return 301 https://$server_name$request_uri;
}